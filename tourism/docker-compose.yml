services:
  tourism-service-db:
    image: postgres:15-alpine
    container_name: tourism-service-db
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/infrastructure/repositories/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tourism-network

  tourism-migrations:
    image: node:18
    container_name: tourism-migrations
    depends_on:
      tourism-service-db:
        condition: service_healthy
    command: sh -c "apt-get update && apt-get install -y postgresql-client && chmod +x runMigrations.sh && ./runMigrations.sh"
    working_dir: /app/tourism
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@tourism-service-db:5432/${POSTGRES_DB}
      - DB_HOST=tourism-service-db
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DB_PORT=5432
    volumes:
      - .:/app/tourism
      - /app/tourism/node_modules
    networks:
      - tourism-network

volumes:
  postgres_data:
    driver: local

networks:
  tourism-network:
    driver: bridge
