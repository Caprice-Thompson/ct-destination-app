name: Infrastructure Deployment

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infrastructure.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  TF_VERSION: "1.6.0"
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-2' }}
  PROJECT_NAME: ${{ secrets.PROJECT_NAME || 'destination-app' }}
  ENVIRONMENT: ${{ secrets.ENVIRONMENT || 'production' }}

jobs:
  validate:
    name: Validate OpenTofu Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}
          tofu_wrapper: false

      - name: Validate Terraform fmt
        working-directory: ./infra/country
        run: tofu fmt -check -recursive

      - name: Initialise OpenTofu
        working-directory: ./infra/country
        run: tofu init -backend=false

      - name: Validate OpenTofu
        working-directory: ./infra/country
        run: tofu validate

  plan:
    name: Plan Infrastructure Changes
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: country/package-lock.json

      - name: Build Lambda package
        working-directory: ./country
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create tfvars file
        working-directory: ./infra/country
        run: |
          cat > terraform.tfvars <<EOF
          aws_region   = "${{ env.AWS_REGION }}"
          environment  = "${{ env.ENVIRONMENT }}"
          project_name = "${{ env.PROJECT_NAME }}"
          node_env     = "${{ secrets.NODE_ENV || 'production' }}"
          EOF

      - name: Initialize OpenTofu
        working-directory: ./infra/country
        run: tofu init

      - name: Plan OpenTofu changes
        working-directory: ./infra/country
        run: |
          tofu plan -out=tfplan -no-color | tee plan.txt

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            infra/tfplan
            infra/plan.txt
          retention-days: 5

      - name: Comment PR with plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/country/plan.txt', 'utf8');
            const truncatedPlan = plan.length > 65000 ? plan.substring(0, 65000) + '\n...(truncated)' : plan;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Infrastructure Plan\n\n\`\`\`terraform\n${truncatedPlan}\n\`\`\``
            })

  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: validate
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    environment:
      name: production
      url: ${{ steps.deploy.outputs.api_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: country/package-lock.json

      - name: Build Lambda package
        working-directory: ./country
        run: |
          npm ci --legacy-peer-deps
          npm run build
          echo "Lambda package built successfully"

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS credentials
        run: |
          aws sts get-caller-identity
          echo "AWS credentials configured"

      - name: Create tfvars file
        working-directory: ./infra/country
        run: |
          cat > terraform.tfvars <<EOF
          aws_region   = "${{ env.AWS_REGION }}"
          environment  = "${{ env.ENVIRONMENT }}"
          project_name = "${{ env.PROJECT_NAME }}"
          node_env     = "${{ secrets.NODE_ENV || 'production' }}"
          EOF
          echo "Variables configured"

      - name: Initialise OpenTofu
        working-directory: ./infra/country
        run: |
          tofu init
          echo "OpenTofu initialized"

      - name: Plan changes
        working-directory: ./infra/country
        run: |
          tofu plan -out=tfplan
          echo "Plan created"

      - name: Apply infrastructure changes
        id: deploy
        working-directory: ./infra/country
        run: |
          tofu apply -auto-approve tfplan
          echo "Infrastructure deployed"

          # Export outputs
          API_URL=$(tofu output -raw country_information_api_gateway_url 2>/dev/null || echo "pending")

          echo "api_url=${API_URL}" >> $GITHUB_OUTPUT

      - name: Save state information
        working-directory: ./infra/country
        run: |
          tofu show -json > tfstate.json
          echo "State saved"

      - name: Upload state artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state-info
          path: infra/country/tfstate.json
          retention-days: 30

      - name: Create deployment summary
        run: |
          echo "## Infrastructure Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Outputs" >> $GITHUB_STEP_SUMMARY
          echo "- **API Gateway URL**: ${{ steps.deploy.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Run database migrations" >> $GITHUB_STEP_SUMMARY
          echo "2. Test API endpoint" >> $GITHUB_STEP_SUMMARY
          echo "3. Monitor CloudWatch logs" >> $GITHUB_STEP_SUMMARY

  destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    environment:
      name: destroy-production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create tfvars file
        working-directory: ./infra/country
        run: |
          cat > terraform.tfvars <<EOF
          aws_region   = "${{ env.AWS_REGION }}"
          environment  = "${{ env.ENVIRONMENT }}"
          project_name = "${{ env.PROJECT_NAME }}"
          node_env     = "${{ secrets.NODE_ENV || 'production' }}"
          EOF

      - name: Initialise OpenTofu
        working-directory: ./infra/country
        run: tofu init

      - name: Destroy infrastructure
        working-directory: ./infra/country
        run: |
          echo "Destroying all infrastructure..."
          tofu destroy -auto-approve
          echo "Infrastructure destroyed"
