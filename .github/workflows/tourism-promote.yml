name: Tourism Promote Deployment Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'tourism/**'
      - 'infra/tourism/**'
      - '.github/workflows/tourism-promote.yml'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests"
        required: false
        default: false
        type: boolean
      skip_infrastructure:
        description: "Skip infrastructure deployment"
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-2' }}
  PROJECT_NAME: ${{ secrets.PROJECT_NAME || 'destination-app' }}
  ENVIRONMENT: ${{ secrets.ENVIRONMENT || 'production' }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: tourism/package-lock.json

      - name: Install dependencies
        working-directory: ./tourism
        run: npm ci

      - name: Run type check
        working-directory: ./tourism
        run: npm run type-check

      - name: Run linter
        working-directory: ./tourism
        run: npm run lint:check

      - name: Run tests
        working-directory: ./tourism
        run: npm test -- --coverage --ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./tourism/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build Lambda Package
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: tourism/package-lock.json

      - name: Install dependencies
        working-directory: ./tourism
        run: npm ci

      - name: Build
        working-directory: ./tourism
        run: npm run build

      - name: Build migration Lambda
        working-directory: ./tourism
        run: npm run build:migration

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tourism-lambda-dist
          path: tourism/dist/
          retention-days: 1

      - name: Upload migration Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: tourism-migration-lambda
          path: tourism/migration-lambda/
          retention-days: 1

  infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [test, build]
    if: |
      github.event.inputs.skip_infrastructure != 'true' && 
      always() && 
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    environment: production
    outputs:
      api_url: ${{ steps.deploy.outputs.api_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: tourism-lambda-dist
          path: tourism/dist/
        continue-on-error: true

      - name: Download migration Lambda artifact
        uses: actions/download-artifact@v4
        with:
          name: tourism-migration-lambda
          path: tourism/migration-lambda/
        continue-on-error: true

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.6.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create tfvars
        working-directory: ./infra/tourism
        run: |
          cat > terraform.tfvars <<EOF
          aws_region   = "${{ env.AWS_REGION }}"
          environment  = "${{ env.ENVIRONMENT }}"
          project_name = "${{ env.PROJECT_NAME }}"
          node_env     = "${{ secrets.NODE_ENV || 'production' }}"
          EOF

      - name: Initialise and apply
        id: deploy
        working-directory: ./infra/tourism
        run: |
          tofu init
          tofu apply -auto-approve

  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    needs: infrastructure
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        working-directory: ./tourism
        run: npm ci

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get database connection info from SSM
        id: rds
        run: |
          DB_USERNAME=$(aws ssm get-parameter --name "/main/db/USERNAME" --query 'Parameter.Value' --output text)
          DB_PASSWORD=$(aws ssm get-parameter --name "/main/db/PASSWORD" --with-decryption --query 'Parameter.Value' --output text)
          RDS_ENDPOINT=$(aws ssm get-parameter --name "/country/db/RDS_ENDPOINT" --query 'Parameter.Value' --output text)
          echo "rds_endpoint=${RDS_ENDPOINT}" >> $GITHUB_OUTPUT
          echo "db_username=${DB_USERNAME}" >> $GITHUB_OUTPUT
          echo "db_password=${DB_PASSWORD}" >> $GITHUB_OUTPUT

      - name: Run migrations script
        working-directory: ./tourism
        run: |
          export PGPASSWORD="${{ steps.rds.outputs.db_password }}"
          psql -h ${{ steps.rds.outputs.rds_endpoint }} \
               -U ${{ steps.rds.outputs.db_username }} \
               -d tourism \
               -f src/infrastructure/repositories/db/migrations/001_create_unesco_sites_table.sql

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [infrastructure, migrate]
    if: always()

    steps:
      - name: Create summary
        run: |
          echo "# Tourism Complete Deployment Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Results" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ needs.test.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Infrastructure: ${{ needs.infrastructure.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Migrations: ${{ needs.migrate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Deployed Resources" >> $GITHUB_STEP_SUMMARY
          echo "- **API URL**: ${{ needs.infrastructure.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Quick Links" >> $GITHUB_STEP_SUMMARY
          echo "- [AWS Lambda Console](https://console.aws.amazon.com/lambda/home?region=${{ env.AWS_REGION }})" >> $GITHUB_STEP_SUMMARY
          echo "- [API Gateway Console](https://console.aws.amazon.com/apigateway/home?region=${{ env.AWS_REGION }})" >> $GITHUB_STEP_SUMMARY
          echo "- [RDS Console](https://console.aws.amazon.com/rds/home?region=${{ env.AWS_REGION }})" >> $GITHUB_STEP_SUMMARY
          echo "- [CloudWatch Logs](https://console.aws.amazon.com/cloudwatch/home?region=${{ env.AWS_REGION }}#logsV2:log-groups)" >> $GITHUB_STEP_SUMMARY

