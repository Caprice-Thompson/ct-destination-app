name: Deploy Lambda Function

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: country/package-lock.json

      - name: Install dependencies and Build
        working-directory: ./country
        run: |
          npm install
          npm run build
          echo "Build completed successfully"

      - name: Package Lambda function
        working-directory: ./country
        run: |
          mkdir -p dist
          cp -r src dist/
          cp -r node_modules dist/
          cp package.json dist/
          cd dist
          zip -r ../lambda-function.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to AWS Lambda
        working-directory: ./country
        run: |
          aws lambda update-function-code --function-name=listCountryInformationHandler --s3-bucket destination-lambda-deploy-storage --s3-key lambda-function.zip
