name: Ephemeral Branch Environment

on:
  push:
    branches-ignore:
      - main
      - master
    paths:
      - "country/**"
      - "infra/**"
      - ".github/workflows/ephemeral-env.yml"
  delete:
    branches-ignore:
      - main
      - master
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - destroy

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.6.0"
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-2' }}
  PROJECT_NAME: ${{ secrets.PROJECT_NAME || 'destination-app' }}

jobs:
  deploy-ephemeral:
    name: Deploy Ephemeral Environment
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract branch name
        id: branch
        run: |
          # Get branch name and sanitize it for AWS resource naming
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          # Replace special chars with hyphens, convert to lowercase, truncate to 20 chars
          SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-20 | sed 's/-$//')
          echo "name=${SANITIZED_BRANCH}" >> $GITHUB_OUTPUT
          echo "original=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "Deploying environment for branch: ${BRANCH_NAME} (sanitized: ${SANITIZED_BRANCH})"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: country/package-lock.json

      - name: Build Lambda package
        working-directory: ./country
        run: |
          npm ci --legacy-peer-deps
          npm run build
          echo "✅ Lambda package built"

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create ephemeral tfvars
        working-directory: ./infra/country
        run: |
          cat > terraform.tfvars <<EOF
          aws_region   = "${{ env.AWS_REGION }}"
          environment  = "${{ steps.branch.outputs.name }}"
          project_name = "${{ env.PROJECT_NAME }}"
          node_env     = "development"
          log_retention_days = 1
          EOF
          echo "✅ Variables configured for ephemeral environment: ${{ steps.branch.outputs.name }}"

      - name: Initialize OpenTofu with workspace
        working-directory: ./infra/country
        run: |
          tofu init
          
          # Create or select workspace for this branch
          tofu workspace select ${{ steps.branch.outputs.name }} || tofu workspace new ${{ steps.branch.outputs.name }}
          
          echo "✅ OpenTofu initialized with workspace: ${{ steps.branch.outputs.name }}"

      - name: Plan infrastructure
        working-directory: ./infra/country
        run: |
          tofu plan -out=tfplan
          echo "✅ Plan created"

      - name: Apply infrastructure
        id: deploy
        working-directory: ./infra/country
        run: |
          tofu apply -auto-approve tfplan
          echo "✅ Infrastructure deployed"
          
          # Get outputs
          API_URL=$(tofu output -raw country_information_api_gateway_url 2>/dev/null || echo "pending")
          LAMBDA_NAME=$(tofu output -raw list_country_information_lambda_name 2>/dev/null || echo "${{ steps.branch.outputs.name }}-list-country-information")
          
          echo "api_url=${API_URL}" >> $GITHUB_OUTPUT
          echo "lambda_name=${LAMBDA_NAME}" >> $GITHUB_OUTPUT

      - name: Create deployment summary
        run: |
          echo "## 🚀 Ephemeral Environment Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ steps.branch.outputs.original }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment Name**: \`${{ steps.branch.outputs.name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Lambda Function**: \`${{ steps.deploy.outputs.lambda_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **API Gateway URL**: ${{ steps.deploy.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Your API" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "curl \"${{ steps.deploy.outputs.api_url }}/country-info?countryName=France\"" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cleanup" >> $GITHUB_STEP_SUMMARY
          echo "This environment will be automatically destroyed when the branch is deleted." >> $GITHUB_STEP_SUMMARY
          echo "Or manually destroy by running the workflow with 'destroy' action." >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR (if exists)
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const branch = '${{ steps.branch.outputs.original }}';
            const apiUrl = '${{ steps.deploy.outputs.api_url }}';
            const lambdaName = '${{ steps.deploy.outputs.lambda_name }}';
            
            // Find open PRs for this branch
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`
            });
            
            if (prs.length > 0) {
              const body = `## 🚀 Ephemeral Environment Deployed
            
            Your branch environment is ready for testing!
            
            ### Environment Details
            - **Environment**: \`${{ steps.branch.outputs.name }}\`
            - **Lambda Function**: \`${lambdaName}\`
            - **API URL**: ${apiUrl}
            
            ### Test Your Changes
            \`\`\`bash
            curl "${apiUrl}/country-info?countryName=France"
            \`\`\`
            
            ### CloudWatch Logs
            [View Lambda Logs](https://console.aws.amazon.com/cloudwatch/home?region=${{ env.AWS_REGION }}#logsV2:log-groups/log-group/$252Faws$252Flambda$252F${{ steps.branch.outputs.name }}-list-country-information)
            
            ---
            *This environment will be automatically destroyed when the branch is deleted.*`;
            
              for (const pr of prs) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: body
                });
              }
            }

  destroy-ephemeral:
    name: Destroy Ephemeral Environment
    runs-on: ubuntu-latest
    if: github.event_name == 'delete' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract branch name
        id: branch
        run: |
          if [ "${{ github.event_name }}" == "delete" ]; then
            BRANCH_NAME="${GITHUB_EVENT_REF#refs/heads/}"
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          fi
          
          SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-20 | sed 's/-$//')
          echo "name=${SANITIZED_BRANCH}" >> $GITHUB_OUTPUT
          echo "original=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "Destroying environment for branch: ${BRANCH_NAME} (sanitized: ${SANITIZED_BRANCH})"

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create ephemeral tfvars
        working-directory: ./infra/country
        run: |
          cat > terraform.tfvars <<EOF
          aws_region   = "${{ env.AWS_REGION }}"
          environment  = "${{ steps.branch.outputs.name }}"
          project_name = "${{ env.PROJECT_NAME }}"
          node_env     = "development"
          EOF

      - name: Initialize OpenTofu and select workspace
        working-directory: ./infra/country
        run: |
          tofu init
          
          # Check if workspace exists
          if tofu workspace list | grep -q "${{ steps.branch.outputs.name }}"; then
            tofu workspace select ${{ steps.branch.outputs.name }}
            echo "✅ Workspace selected: ${{ steps.branch.outputs.name }}"
          else
            echo "⚠️  Workspace ${{ steps.branch.outputs.name }} not found, nothing to destroy"
            exit 0
          fi

      - name: Destroy infrastructure
        working-directory: ./infra/country
        continue-on-error: true
        run: |
          tofu destroy -auto-approve
          echo "✅ Infrastructure destroyed"

      - name: Delete workspace
        working-directory: ./infra/country
        continue-on-error: true
        run: |
          tofu workspace select default
          tofu workspace delete ${{ steps.branch.outputs.name }}
          echo "✅ Workspace deleted"

      - name: Create destruction summary
        run: |
          echo "## 🗑️ Ephemeral Environment Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ steps.branch.outputs.original }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment Name**: \`${{ steps.branch.outputs.name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Cleaned up successfully ✅" >> $GITHUB_STEP_SUMMARY

