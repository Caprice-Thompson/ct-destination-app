name: Earthquakes Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'earthquakes/**'
      - 'infra/earthquakes/**'
      - '.github/workflows/earthquakes-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'earthquakes/**'
      - 'infra/earthquakes/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - deploy-code-only
          - destroy

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-2' }}
  PROJECT_NAME: ${{ secrets.PROJECT_NAME || 'destination-app' }}
  ENVIRONMENT: ${{ secrets.ENVIRONMENT || 'production' }}
  SERVICE_NAME: 'earthquakes'

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: earthquakes/package-lock.json
      
      - name: Install dependencies
        working-directory: ./earthquakes
        run: npm ci
      
      - name: Run linter
        working-directory: ./earthquakes
        run: npm run lint:check
      
      - name: Run type check
        working-directory: ./earthquakes
        run: npm run type-check
      
      - name: Run tests
        working-directory: ./earthquakes
        run: npm test
      
      - name: Build Lambda package
        working-directory: ./earthquakes
        run: npm run build
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: earthquakes-lambda-package
          path: earthquakes/dist/
          retention-days: 7

  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [test]
    if: |
      github.event_name == 'push' && 
      github.ref == 'refs/heads/main' &&
      github.event.inputs.action == 'deploy'
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: earthquakes-lambda-package
          path: earthquakes/dist/
      
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.6.0'
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Create tfvars
        working-directory: ./infra/earthquakes
        run: |
          cat > terraform.tfvars <<EOF
          aws_region              = "${{ env.AWS_REGION }}"
          environment             = "${{ env.ENVIRONMENT }}"
          project_name            = "${{ env.PROJECT_NAME }}"
          node_env                = "${{ secrets.NODE_ENV || 'production' }}"
          earthquakes_api_url     = "${{ secrets.EARTHQUAKES_API_URL }}"
          rest_countries_api_url  = "${{ secrets.REST_COUNTRIES_API_URL }}"
          dynamodb_earthquakes_table = "${{ secrets.DYNAMODB_EARTHQUAKES_TABLE }}"
          EOF
      
      - name: Initialize OpenTofu
        working-directory: ./infra/earthquakes
        run: tofu init
      
      - name: Plan changes
        working-directory: ./infra/earthquakes
        run: tofu plan -out=tfplan
      
      - name: Apply changes
        working-directory: ./infra/earthquakes
        run: tofu apply -auto-approve tfplan

  deploy-code-only:
    name: Deploy Lambda Code
    runs-on: ubuntu-latest
    needs: [test]
    if: |
      github.event_name == 'push' && 
      github.ref == 'refs/heads/main' &&
      github.event.inputs.action == 'deploy-code-only'
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: earthquakes-lambda-package
          path: earthquakes/dist/
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Package Lambda
        working-directory: ./earthquakes/dist
        run: zip -r ../lambda-package.zip .
      
      - name: Update Lambda function
        working-directory: ./earthquakes
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.ENVIRONMENT }}-most-recent-eqs \
            --zip-file fileb://lambda-package.zip \
            --publish

  destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'destroy'
    environment: destroy-production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.6.0'
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Create tfvars
        working-directory: ./infra/earthquakes
        run: |
          cat > terraform.tfvars <<EOF
          aws_region              = "${{ env.AWS_REGION }}"
          environment             = "${{ env.ENVIRONMENT }}"
          project_name            = "${{ env.PROJECT_NAME }}"
          node_env                = "${{ secrets.NODE_ENV || 'production' }}"
          earthquakes_api_url     = "${{ secrets.EARTHQUAKES_API_URL }}"
          rest_countries_api_url  = "${{ secrets.REST_COUNTRIES_API_URL }}"
          dynamodb_earthquakes_table = "${{ secrets.DYNAMODB_EARTHQUAKES_TABLE }}"
          EOF
      
      - name: Initialize OpenTofu
        working-directory: ./infra/earthquakes
        run: tofu init
      
      - name: Destroy infrastructure
        working-directory: ./infra/earthquakes
        run: tofu destroy -auto-approve

