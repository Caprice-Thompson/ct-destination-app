name: Promote Deployment Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests"
        required: false
        default: false
        type: boolean
      skip_infrastructure:
        description: "Skip infrastructure deployment"
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-2' }}
  PROJECT_NAME: ${{ secrets.PROJECT_NAME || 'destination-app' }}
  ENVIRONMENT: ${{ secrets.ENVIRONMENT || 'production' }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: country/package-lock.json

      - name: Install dependencies
        working-directory: ./country
        run: npm ci --legacy-peer-deps

      - name: Run type check
        working-directory: ./country
        run: npm run type-check

      - name: Run linter
        working-directory: ./country
        run: npm run lint:check

      - name: Run tests
        working-directory: ./country
        run: npm test -- --coverage --ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./country/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build Lambda Package
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: country/package-lock.json

      - name: Install dependencies
        working-directory: ./country
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: ./country
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-dist
          path: country/dist/
          retention-days: 1

  infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.skip_infrastructure != 'true'
    environment: production
    outputs:
      api_url: ${{ steps.deploy.outputs.api_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-dist
          path: country/dist/

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.6.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create tfvars
        working-directory: ./infra/country
        run: |
          cat > terraform.tfvars <<EOF
          aws_region   = "${{ env.AWS_REGION }}"
          environment  = "${{ env.ENVIRONMENT }}"
          project_name = "${{ env.PROJECT_NAME }}"
          node_env     = "${{ secrets.NODE_ENV || 'production' }}"
          EOF

      - name: Initialise and apply
        id: deploy
        working-directory: ./infra/country
        run: |
          terraform init
          terraform apply -auto-approve

          API_URL=$(terraform output -raw country_information_api_gateway_url 2>/dev/null || echo "pending")

          echo "api_url=${API_URL}" >> $GITHUB_OUTPUT

  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    needs: infrastructure
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        working-directory: ./country
        run: npm ci --legacy-peer-deps

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get database connection info from SSM
        id: rds
        run: |
          DB_USERNAME=$(aws ssm get-parameter --name "/county/main/db/db_username" --query 'Parameter.Value' --output text)
          DB_PASSWORD=$(aws ssm get-parameter --name "/county/main/db/db_password" --with-decryption --query 'Parameter.Value' --output text)
          RDS_ENDPOINT=$(aws ssm get-parameter --name "/county/main/db/RDS_ENDPOINT" --query 'Parameter.Value' --output text)
          echo "rds_endpoint=${RDS_ENDPOINT}" >> $GITHUB_OUTPUT
          echo "db_username=${DB_USERNAME}" >> $GITHUB_OUTPUT
          echo "db_password=${DB_PASSWORD}" >> $GITHUB_OUTPUT

      - name: Run migrations script
        working-directory: ./country
        run: |
          chmod +x runMigrations.sh
          ./runMigrations.sh
        env:
          DATABASE_URL: postgresql://${{ steps.rds.outputs.db_username }}:${{ steps.rds.outputs.db_password }}@${{ steps.rds.outputs.rds_endpoint }}:5432/county


