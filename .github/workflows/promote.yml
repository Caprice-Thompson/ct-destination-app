name: Promote Deployment Pipeline

on:
  push:
    branches: [main]
    paths:
      - "country/**"
      - "earthquakes/**"
      - "tourism/**"
      - "infra/**"
      - ".github/workflows/promote.yml"
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-2' }}
  PROJECT_NAME: ${{ secrets.PROJECT_NAME || 'destination-app' }}
  ENVIRONMENT: ${{ secrets.ENVIRONMENT || 'production' }}

jobs:
  test-country:
    name: Test Country Service
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: country/package-lock.json

      - name: Install dependencies
        working-directory: ./country
        run: npm ci --legacy-peer-deps

      - name: Run type check
        working-directory: ./country
        run: npm run type-check

      - name: Run linter
        working-directory: ./country
        run: npm run lint:check

      - name: Run tests
        working-directory: ./country
        run: npm test -- --coverage --ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./country/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: country

  test-earthquakes:
    name: Test Earthquakes Service
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: earthquakes/package-lock.json

      - name: Install dependencies
        working-directory: ./earthquakes
        run: npm ci --legacy-peer-deps

      - name: Run type check
        working-directory: ./earthquakes
        run: npm run type-check

      - name: Run linter
        working-directory: ./earthquakes
        run: npm run lint:check

      - name: Run tests
        working-directory: ./earthquakes
        run: npm test -- --coverage --ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./earthquakes/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: earthquakes

  test-tourism:
    name: Test Tourism Service
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: tourism/package-lock.json

      - name: Install dependencies
        working-directory: ./tourism
        run: npm ci --legacy-peer-deps

      - name: Run type check
        working-directory: ./tourism
        run: npm run type-check

      - name: Run linter
        working-directory: ./tourism
        run: npm run lint:check

      - name: Run tests
        working-directory: ./tourism
        run: npm test -- --coverage --ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./tourism/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: tourism
