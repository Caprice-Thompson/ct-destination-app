name: Promote Deployment Pipeline

on:
  push:
    branches: [main]
    paths:
      - "country/**"
      - "earthquakes/**"
      - "tourism/**"
      - "infra/**"
      - ".github/workflows/promote.yml"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests"
        required: false
        default: false
        type: boolean
      skip_infrastructure:
        description: "Skip infrastructure deployment"
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-2' }}
  PROJECT_NAME: ${{ secrets.PROJECT_NAME || 'destination-app' }}
  ENVIRONMENT: ${{ secrets.ENVIRONMENT || 'production' }}

jobs:
  test-country:
    name: Test Country Service
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: country/package-lock.json

      - name: Install dependencies
        working-directory: ./country
        run: npm ci --legacy-peer-deps

      - name: Run type check
        working-directory: ./country
        run: npm run type-check

      - name: Run linter
        working-directory: ./country
        run: npm run lint:check

      - name: Run tests
        working-directory: ./country
        run: npm test -- --coverage --ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./country/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: country

  test-earthquakes:
    name: Test Earthquakes Service
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: earthquakes/package-lock.json

      - name: Install dependencies
        working-directory: ./earthquakes
        run: npm ci --legacy-peer-deps

      - name: Run type check
        working-directory: ./earthquakes
        run: npm run type-check

      - name: Run linter
        working-directory: ./earthquakes
        run: npm run lint:check

      - name: Run tests
        working-directory: ./earthquakes
        run: npm test -- --coverage --ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./earthquakes/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: earthquakes

  test-tourism:
    name: Test Tourism Service
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: tourism/package-lock.json

      - name: Install dependencies
        working-directory: ./tourism
        run: npm ci --legacy-peer-deps

      - name: Run type check
        working-directory: ./tourism
        run: npm run type-check

      - name: Run linter
        working-directory: ./tourism
        run: npm run lint:check

      - name: Run tests
        working-directory: ./tourism
        run: npm test -- --coverage --ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./tourism/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: tourism

  build-country:
    name: Build Country Service
    runs-on: ubuntu-latest
    needs: test-country
    if: always() && (needs.test-country.result == 'success' || needs.test-country.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: country/package-lock.json

      - name: Install dependencies
        working-directory: ./country
        run: npm ci --legacy-peer-deps

      - name: Build Lambda
        working-directory: ./country
        run: npm run build

      - name: Build migration Lambda
        working-directory: ./country
        run: npm run build:migration

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: country-lambda-dist
          path: country/dist/
          retention-days: 1

      - name: Upload migration Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: country-migration-lambda
          path: country/migration-lambda/
          retention-days: 1

  build-earthquakes:
    name: Build Earthquakes Service
    runs-on: ubuntu-latest
    needs: test-earthquakes
    if: always() && (needs.test-earthquakes.result == 'success' || needs.test-earthquakes.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: earthquakes/package-lock.json

      - name: Install dependencies
        working-directory: ./earthquakes
        run: npm ci --legacy-peer-deps

      - name: Build Lambda
        working-directory: ./earthquakes
        run: npm run build

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: earthquakes-lambda-dist
          path: earthquakes/dist/
          retention-days: 1

  build-tourism:
    name: Build Tourism Service
    runs-on: ubuntu-latest
    needs: test-tourism
    if: always() && (needs.test-tourism.result == 'success' || needs.test-tourism.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: tourism/package-lock.json

      - name: Install dependencies
        working-directory: ./tourism
        run: npm ci --legacy-peer-deps

      - name: Build Lambda
        working-directory: ./tourism
        run: npm run build

      - name: Build migration Lambda
        working-directory: ./tourism
        run: npm run build:migration

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: tourism-lambda-dist
          path: tourism/dist/
          retention-days: 1

      - name: Upload migration Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: tourism-migration-lambda
          path: tourism/migration-lambda/
          retention-days: 1

  infrastructure-shared:
    name: Deploy Shared Infrastructure
    runs-on: ubuntu-latest
    needs: [build-country, build-earthquakes, build-tourism]
    if: |
      github.event.inputs.skip_infrastructure != 'true' && 
      always() && 
      (needs.build-country.result == 'success' || needs.build-country.result == 'skipped') &&
      (needs.build-earthquakes.result == 'success' || needs.build-earthquakes.result == 'skipped') &&
      (needs.build-tourism.result == 'success' || needs.build-tourism.result == 'skipped')
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.6.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create tfvars
        working-directory: ./infra/shared
        run: |
          cat > terraform.tfvars <<EOF
          aws_region   = "${{ env.AWS_REGION }}"
          environment  = "${{ env.ENVIRONMENT }}"
          project_name = "${{ env.PROJECT_NAME }}"
          db_username  = "${{ secrets.DB_USERNAME }}"
          db_password  = "${{ secrets.DB_PASSWORD }}"
          EOF

      - name: Deploy shared infrastructure
        working-directory: ./infra/shared
        run: |
          tofu init
          tofu apply -auto-approve

  infrastructure-country:
    name: Deploy Country Infrastructure
    runs-on: ubuntu-latest
    needs: infrastructure-shared
    if: |
      github.event.inputs.skip_infrastructure != 'true' && 
      always() && 
      (needs.infrastructure-shared.result == 'success' || needs.infrastructure-shared.result == 'skipped')
    environment: production
    outputs:
      api_url: ${{ steps.deploy.outputs.api_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.6.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Lambda artifact
        uses: actions/download-artifact@v4
        with:
          name: country-lambda-dist
          path: country/dist/
        continue-on-error: true

      - name: Download migration Lambda artifact
        uses: actions/download-artifact@v4
        with:
          name: country-migration-lambda
          path: country/migration-lambda/
        continue-on-error: true

      - name: Create tfvars
        working-directory: ./infra/country
        run: |
          cat > terraform.tfvars <<EOF
          aws_region              = "${{ env.AWS_REGION }}"
          environment             = "${{ env.ENVIRONMENT }}"
          project_name            = "${{ env.PROJECT_NAME }}"
          node_env                = "${{ secrets.NODE_ENV || 'production' }}"
          rest_countries_api_url  = "https://restcountries.com/v3.1/name"
          db_username             = "/main/db/USERNAME"
          db_password             = "/main/db/PASSWORD"
          EOF

      - name: Deploy country infrastructure
        id: deploy
        working-directory: ./infra/country
        run: |
          tofu init
          tofu apply -auto-approve
          echo "api_url=$(tofu output -raw country_information_api_url)" >> $GITHUB_OUTPUT

  infrastructure-earthquakes:
    name: Deploy Earthquakes Infrastructure
    runs-on: ubuntu-latest
    needs: infrastructure-shared
    if: |
      github.event.inputs.skip_infrastructure != 'true' && 
      always() && 
      (needs.infrastructure-shared.result == 'success' || needs.infrastructure-shared.result == 'skipped')
    environment: production
    outputs:
      api_url: ${{ steps.deploy.outputs.api_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Lambda artifact
        uses: actions/download-artifact@v4
        with:
          name: earthquakes-lambda-dist
          path: earthquakes/dist/
        continue-on-error: true

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.6.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create tfvars
        working-directory: ./infra/earthquakes
        run: |
          cat > terraform.tfvars <<EOF
          aws_region   = "${{ env.AWS_REGION }}"
          environment  = "${{ env.ENVIRONMENT }}"
          project_name = "${{ env.PROJECT_NAME }}"
          node_env     = "${{ secrets.NODE_ENV || 'production' }}"
          EOF

      - name: Deploy earthquakes infrastructure
        id: deploy
        working-directory: ./infra/earthquakes
        run: |
          tofu init
          tofu apply -auto-approve
          echo "api_url=$(tofu output -raw api_gateway_url)" >> $GITHUB_OUTPUT

  infrastructure-tourism:
    name: Deploy Tourism Infrastructure
    runs-on: ubuntu-latest
    needs: infrastructure-shared
    if: |
      github.event.inputs.skip_infrastructure != 'true' && 
      always() && 
      (needs.infrastructure-shared.result == 'success' || needs.infrastructure-shared.result == 'skipped')
    environment: production
    outputs:
      api_url: ${{ steps.deploy.outputs.api_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Lambda artifact
        uses: actions/download-artifact@v4
        with:
          name: tourism-lambda-dist
          path: tourism/dist/
        continue-on-error: true

      - name: Download migration Lambda artifact
        uses: actions/download-artifact@v4
        with:
          name: tourism-migration-lambda
          path: tourism/migration-lambda/
        continue-on-error: true

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.6.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create tfvars
        working-directory: ./infra/tourism
        run: |
          cat > terraform.tfvars <<EOF
          aws_region   = "${{ env.AWS_REGION }}"
          environment  = "${{ env.ENVIRONMENT }}"
          project_name = "${{ env.PROJECT_NAME }}"
          node_env     = "${{ secrets.NODE_ENV || 'production' }}"
          db_username  = "/main/db/USERNAME"
          db_password  = "/main/db/PASSWORD"
          EOF

      - name: Deploy tourism infrastructure
        id: deploy
        working-directory: ./infra/tourism
        run: |
          tofu init
          tofu apply -auto-approve
          echo "api_url=$(tofu output -raw api_gateway_url)" >> $GITHUB_OUTPUT

  migrate-country:
    name: Run Country DB Migrations
    runs-on: ubuntu-latest
    needs: infrastructure-country
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        working-directory: ./country
        run: npm ci --legacy-peer-deps

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get database connection info from SSM
        id: rds
        run: |
          DB_USERNAME=$(aws ssm get-parameter --name "/main/db/USERNAME" --query 'Parameter.Value' --output text)
          DB_PASSWORD=$(aws ssm get-parameter --name "/main/db/PASSWORD" --with-decryption --query 'Parameter.Value' --output text)
          RDS_ENDPOINT=$(aws ssm get-parameter --name "/country/db/RDS_ENDPOINT" --query 'Parameter.Value' --output text)
          echo "rds_endpoint=${RDS_ENDPOINT}" >> $GITHUB_OUTPUT
          echo "db_username=${DB_USERNAME}" >> $GITHUB_OUTPUT
          echo "db_password=${DB_PASSWORD}" >> $GITHUB_OUTPUT

      - name: Run migrations
        working-directory: ./country
        run: |
          chmod +x runMigrations.sh
          ./runMigrations.sh
        env:
          ENVIRONMENT: production
          AWS_REGION: ${{ env.AWS_REGION }}
          DATABASE_URL: postgresql://${{ steps.rds.outputs.db_username }}:${{ steps.rds.outputs.db_password }}@${{ steps.rds.outputs.rds_endpoint }}:5432/country

  migrate-tourism:
    name: Run Tourism DB Migrations
    runs-on: ubuntu-latest
    needs: infrastructure-tourism
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        working-directory: ./tourism
        run: npm ci --legacy-peer-deps

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get database connection info from SSM
        id: rds
        run: |
          DB_USERNAME=$(aws ssm get-parameter --name "/main/db/USERNAME" --query 'Parameter.Value' --output text)
          DB_PASSWORD=$(aws ssm get-parameter --name "/main/db/PASSWORD" --with-decryption --query 'Parameter.Value' --output text)
          RDS_ENDPOINT=$(aws ssm get-parameter --name "/country/db/RDS_ENDPOINT" --query 'Parameter.Value' --output text)
          echo "rds_endpoint=${RDS_ENDPOINT}" >> $GITHUB_OUTPUT
          echo "db_username=${DB_USERNAME}" >> $GITHUB_OUTPUT
          echo "db_password=${DB_PASSWORD}" >> $GITHUB_OUTPUT

      - name: Create migration script
        working-directory: ./tourism
        run: |
          cat > runMigrations.sh <<'EOF'
          #!/bin/bash
          set -e

          MIGRATIONS_PATH="./src/infrastructure/repositories/db/migrations"
          MIGRATIONS_TABLE="schema_migrations"

          if [ -z "$DATABASE_URL" ]; then
              echo "ERROR: DATABASE_URL is not set"
              exit 1
          fi

          # Extract connection details
          DB_USER=$(echo $DATABASE_URL | sed -n 's|.*://\([^:]*\):.*|\1|p')
          DB_PASSWORD=$(echo $DATABASE_URL | sed -n 's|.*://[^:]*:\([^@]*\)@.*|\1|p')
          DB_HOST=$(echo $DATABASE_URL | sed -n 's|.*@\([^:]*\):.*|\1|p')
          DB_PORT=$(echo $DATABASE_URL | sed -n 's|.*:\([0-9]*\)/.*|\1|p')
          DB_NAME=$(echo $DATABASE_URL | sed -n 's|.*/\([^?]*\).*|\1|p')

          export PGPASSWORD="$DB_PASSWORD"

          echo "Creating migrations table if it doesn't exist..."
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" <<SQL
          CREATE TABLE IF NOT EXISTS $MIGRATIONS_TABLE (
              id SERIAL PRIMARY KEY,
              filename VARCHAR(255) NOT NULL UNIQUE,
              executed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          SQL

          echo "Running migrations from $MIGRATIONS_PATH..."
          for file in $(ls "$MIGRATIONS_PATH"/*.sql 2>/dev/null | sort); do
              filename=$(basename "$file")
              
              already_run=$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -t -c \
                  "SELECT COUNT(*) FROM $MIGRATIONS_TABLE WHERE filename = '$filename';")
              
              if [ $(echo $already_run | tr -d ' ') -eq 0 ]; then
                  echo "Running migration: $filename"
                  psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -f "$file"
                  psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -c \
                      "INSERT INTO $MIGRATIONS_TABLE (filename) VALUES ('$filename');"
                  echo "✓ Migration $filename completed"
              else
                  echo "Skipping migration $filename (already run)"
              fi
          done

          echo "All migrations completed successfully!"
          EOF
          chmod +x runMigrations.sh

      - name: Run migrations
        working-directory: ./tourism
        run: ./runMigrations.sh
        env:
          DATABASE_URL: postgresql://${{ steps.rds.outputs.db_username }}:${{ steps.rds.outputs.db_password }}@${{ steps.rds.outputs.rds_endpoint }}:5432/tourism

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs:
      [
        infrastructure-country,
        infrastructure-earthquakes,
        infrastructure-tourism,
        migrate-country,
        migrate-tourism,
      ]
    if: always()

    steps:
      - name: Create summary
        run: |
          echo "# Complete Deployment Pipeline - All Services" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Country Tests: ${{ needs.test-country.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Earthquakes Tests: ${{ needs.test-earthquakes.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tourism Tests: ${{ needs.test-tourism.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "- Country Build: ${{ needs.build-country.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Earthquakes Build: ${{ needs.build-earthquakes.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tourism Build: ${{ needs.build-tourism.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Infrastructure Results" >> $GITHUB_STEP_SUMMARY
          echo "- Shared Infrastructure: ${{ needs.infrastructure-shared.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Country Infrastructure: ${{ needs.infrastructure-country.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Earthquakes Infrastructure: ${{ needs.infrastructure-earthquakes.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tourism Infrastructure: ${{ needs.infrastructure-tourism.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Migration Results" >> $GITHUB_STEP_SUMMARY
          echo "- Country Migrations: ${{ needs.migrate-country.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tourism Migrations: ${{ needs.migrate-tourism.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Deployed Resources" >> $GITHUB_STEP_SUMMARY
          echo "- **Country API**: ${{ needs.infrastructure-country.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Earthquakes API**: ${{ needs.infrastructure-earthquakes.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tourism API**: ${{ needs.infrastructure-tourism.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Quick Links" >> $GITHUB_STEP_SUMMARY
          echo "- [AWS Lambda Console](https://console.aws.amazon.com/lambda/home?region=${{ env.AWS_REGION }})" >> $GITHUB_STEP_SUMMARY
          echo "- [API Gateway Console](https://console.aws.amazon.com/apigateway/home?region=${{ env.AWS_REGION }})" >> $GITHUB_STEP_SUMMARY
          echo "- [RDS Console](https://console.aws.amazon.com/rds/home?region=${{ env.AWS_REGION }})" >> $GITHUB_STEP_SUMMARY
          echo "- [CloudWatch Logs](https://console.aws.amazon.com/cloudwatch/home?region=${{ env.AWS_REGION }}#logsV2:log-groups)" >> $GITHUB_STEP_SUMMARY
