name: Promote Deployment Pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - "country/**"
      - "earthquakes/**"
      - "tourism/**"
      - "weather/**"
      - "infra/**"
      - ".github/workflows/promote.yml"
  push:
    branches: [main]
    paths:
      - "country/**"
      - "earthquakes/**"
      - "tourism/**"
      - "weather/**"
      - "infra/**"
      - ".github/workflows/promote.yml"
  workflow_dispatch:

jobs:
  test-country:
    name: Test Country Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: country/package-lock.json

      - name: Install dependencies
        working-directory: ./country
        run: npm ci --legacy-peer-deps

      - name: Run linter
        working-directory: ./country
        run: npm run lint

      - name: Run tests
        working-directory: ./country
        run: npm test -- --coverage --ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./country/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: country

  test-earthquakes:
    name: Test Earthquakes Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: earthquakes/package-lock.json

      - name: Install dependencies
        working-directory: ./earthquakes
        run: npm ci --legacy-peer-deps

      - name: Run linter
        working-directory: ./earthquakes
        run: npm run lint

      - name: Run tests
        working-directory: ./earthquakes
        run: npm test -- --coverage --ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./earthquakes/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: earthquakes

  test-tourism:
    name: Test Tourism Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: tourism/package-lock.json

      - name: Install dependencies
        working-directory: ./tourism
        run: npm ci --legacy-peer-deps

      - name: Run linter
        working-directory: ./tourism
        run: npm run lint

      - name: Run tests
        working-directory: ./tourism
        run: npm test -- --coverage --ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./tourism/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: tourism

  test-weather:
    name: Test Weather Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: weather/package-lock.json

      - name: Install dependencies
        working-directory: ./weather
        run: npm ci --legacy-peer-deps

      - name: Run linter
