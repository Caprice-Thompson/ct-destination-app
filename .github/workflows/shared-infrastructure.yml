name: Shared Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/shared/**'
      - '.github/workflows/shared-infrastructure.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/shared/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-2' }}
  PROJECT_NAME: ${{ secrets.PROJECT_NAME || 'destination-app' }}
  ENVIRONMENT: ${{ secrets.ENVIRONMENT || 'production' }}

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.6.0'
      
      - name: Validate format
        working-directory: ./infra/shared
        run: tofu fmt -check -recursive
      
      - name: Initialize
        working-directory: ./infra/shared
        run: tofu init -backend=false
      
      - name: Validate
        working-directory: ./infra/shared
        run: tofu validate

  plan:
    name: Plan Changes
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request' || github.event.inputs.action == 'plan'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.6.0'
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Create tfvars
        working-directory: ./infra/shared
        run: |
          cat > terraform.tfvars <<EOF
          aws_region         = "${{ env.AWS_REGION }}"
          environment        = "${{ env.ENVIRONMENT }}"
          project_name       = "${{ env.PROJECT_NAME }}"
          db_username        = "${{ secrets.DB_USERNAME }}"
          db_password        = "${{ secrets.DB_PASSWORD }}"
          enable_nat_gateway = true
          EOF
      
      - name: Initialize
        working-directory: ./infra/shared
        run: tofu init
      
      - name: Plan
        working-directory: ./infra/shared
        run: tofu plan -out=tfplan -no-color | tee plan.txt
      
      - name: Comment PR with plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/shared/plan.txt', 'utf8');
            const truncatedPlan = plan.length > 65000 ? plan.substring(0, 65000) + '\n...(truncated)' : plan;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Shared Infrastructure Plan\n\n**WARNING**: Changes to shared infrastructure affect both Country and Tourism services!\n\n\`\`\`terraform\n${truncatedPlan}\n\`\`\``
            })

  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: validate
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event.inputs.action == 'apply'
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.6.0'
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Create tfvars
        working-directory: ./infra/shared
        run: |
          cat > terraform.tfvars <<EOF
          aws_region         = "${{ env.AWS_REGION }}"
          environment        = "${{ env.ENVIRONMENT }}"
          project_name       = "${{ env.PROJECT_NAME }}"
          db_username        = "${{ secrets.DB_USERNAME }}"
          db_password        = "${{ secrets.DB_PASSWORD }}"
          enable_nat_gateway = true
          EOF
      
      - name: Initialize
        working-directory: ./infra/shared
        run: tofu init
      
      - name: Plan
        working-directory: ./infra/shared
        run: tofu plan -out=tfplan
      
      - name: Apply
        id: apply
        working-directory: ./infra/shared
        run: |
          tofu apply -auto-approve tfplan
          
          # Export outputs
          VPC_ID=$(tofu output -raw vpc_id)
          RDS_ENDPOINT=$(tofu output -raw rds_endpoint)
          
          echo "vpc_id=$VPC_ID" >> $GITHUB_OUTPUT
          echo "rds_endpoint=$RDS_ENDPOINT" >> $GITHUB_OUTPUT

  destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'destroy'
    environment: destroy-production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.6.0'
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Create tfvars
        working-directory: ./infra/shared
        run: |
          cat > terraform.tfvars <<EOF
          aws_region         = "${{ env.AWS_REGION }}"
          environment        = "${{ env.ENVIRONMENT }}"
          project_name       = "${{ env.PROJECT_NAME }}"
          db_username        = "${{ secrets.DB_USERNAME }}"
          db_password        = "${{ secrets.DB_PASSWORD }}"
          enable_nat_gateway = true
          EOF
      
      - name: Initialize
        working-directory: ./infra/shared
        run: tofu init
      
      - name: Destroy
        working-directory: ./infra/shared
        run: tofu destroy -auto-approve

