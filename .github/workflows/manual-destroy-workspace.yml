name: Manual Destroy Workspace

on:
  workflow_dispatch:
    inputs:
      workspace_name:
        description: 'Workspace name to destroy (e.g., feature-branch-name)'
        required: true
        type: string
      confirm_destroy:
        description: 'Type "destroy" to confirm'
        required: true
        type: string

jobs:
  destroy:
    name: Destroy Workspace
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "destroy" ]; then
            echo "ERROR: Confirmation failed. You must type 'destroy' to proceed."
            exit 1
          fi
          echo "Confirmation validated"
      
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.6.0
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
      
      - name: Initialize Terraform
        working-directory: ./infra/country
        run: tofu init
      
      - name: Check if workspace exists
        id: check_workspace
        working-directory: ./infra/country
        run: |
          if tofu workspace list | grep -q "${{ github.event.inputs.workspace_name }}"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Workspace '${{ github.event.inputs.workspace_name }}' found"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "ERROR: Workspace '${{ github.event.inputs.workspace_name }}' does not exist"
          fi
      
      - name: Select workspace
        if: steps.check_workspace.outputs.exists == 'true'
        working-directory: ./infra/country
        run: |
          tofu workspace select ${{ github.event.inputs.workspace_name }}
          echo "Selected workspace: ${{ github.event.inputs.workspace_name }}"
      
      - name: Show resources to be destroyed
        if: steps.check_workspace.outputs.exists == 'true'
        working-directory: ./infra/country
        run: |
          echo "Resources in workspace '${{ github.event.inputs.workspace_name }}':"
          tofu state list || echo "No resources found"
      
      - name: Destroy infrastructure
        if: steps.check_workspace.outputs.exists == 'true'
        working-directory: ./infra/country
        run: |
          echo "Destroying all resources in workspace: ${{ github.event.inputs.workspace_name }}"
          tofu destroy -auto-approve
      
      - name: Switch to default workspace
        if: steps.check_workspace.outputs.exists == 'true'
        working-directory: ./infra/country
        run: tofu workspace select default
      
      - name: Delete workspace
        if: steps.check_workspace.outputs.exists == 'true'
        working-directory: ./infra/country
        run: |
          tofu workspace delete ${{ github.event.inputs.workspace_name }}
          echo "Workspace '${{ github.event.inputs.workspace_name }}' deleted"
      
      - name: Summary
        if: steps.check_workspace.outputs.exists == 'true'
        run: |
          echo "## Workspace Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Successfully destroyed workspace: **${{ github.event.inputs.workspace_name }}**" >> $GITHUB_STEP_SUMMARY
      
      - name: Workspace not found
        if: steps.check_workspace.outputs.exists == 'false'
        run: |
          echo "## Workspace Not Found" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Workspace **${{ github.event.inputs.workspace_name }}** does not exist." >> $GITHUB_STEP_SUMMARY
          exit 1

