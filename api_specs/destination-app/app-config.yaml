app:
  title: Destination API
  baseUrl: http://localhost:3000

  # Discover frontend plugins from packages/app/package.json.
  packages: all

  extensions:
    # Catalog is the landing page. API Docs stays on its own route.
    - page:catalog:
        config:
          path: /

organization:
  name: Destination App

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'

auth:
  providers:
    guest: {}

catalog:
  rules:
    - allow: [Component, System, API]
  locations:
    # Owner of the API entity. Loaded first so the reference resolves.
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]

    # System and the local API component that provides the OpenAPI entity.
    - type: file
      target: ../../examples/destination-catalog.yaml

    # Generated from examples/destination-app.openapi.yaml by yarn sync:openapi-catalog.
    - type: file
      target: ../../examples/destination-api-inline.yaml

permission:
  enabled: false