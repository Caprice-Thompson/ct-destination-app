services:
  country-service-db:
    image: postgres:15-alpine
    container_name: country-service-db
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/infrastructure/repositories/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - country-network

  country-migrations:
    image: node:18
    container_name: country-migrations
    depends_on:
      country-service-db:
        condition: service_healthy
    command: sh -c "apt-get update && apt-get install -y postgresql-client && chmod +x runMigrations.sh && ./runMigrations.sh"
    working_dir: /app/country
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@country-service-db:5432/${POSTGRES_DB}
      - DB_HOST=country-service-db
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DB_PORT=5432
    volumes:
      - .:/app/country
      - /app/country/node_modules
    networks:
      - country-network

  country-data-migration:
    image: node:18
    container_name: country-data-migration
    depends_on:
      country-migrations:
        condition: service_completed_successfully
    command: sh -c "cd migrate && npm install && npm run migrate"
    working_dir: /app/country
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@country-service-db:5432/${POSTGRES_DB}
    volumes:
      - .:/app/country
      - /app/country/migrate/node_modules
    networks:
      - country-network

volumes:
  postgres_data:
    driver: local

networks:
  country-network:
    driver: bridge
